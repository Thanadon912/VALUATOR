[agent]
  interval = "5s"
  flush_interval = "5s"
  hostname = "valuator-perf-db-observer"

[[outputs.influxdb]]
  urls = ["http://127.0.0.1:8086"]
  database = "telegraf"
  timeout = "5s"

[[inputs.postgresql]]
  address = "${PERF_POSTGRES_DSN}"
  databases = ["postgres"]
  ignored_databases = ["template0", "template1"]
  prepared_statements = false
