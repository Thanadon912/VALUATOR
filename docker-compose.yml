services:
  backend:
    image: ${BACKEND_IMAGE:-valuator-backend:local}
    build:
      context: ./Back-End
      target: runtime
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8200}:8000"
    environment:
      ENABLE_LIVE_PROVIDERS: ${ENABLE_LIVE_PROVIDERS:-true}
      PERFORMANCE_CACHE_ONLY_ENABLED: ${PERFORMANCE_CACHE_ONLY_ENABLED:-false}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-USAStockAnalysis contact@example.com}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-8}
      FRED_API_KEY: ${FRED_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_TIMEOUT_SECONDS: ${SUPABASE_TIMEOUT_SECONDS:-5}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_API_SECRET: ${ALPACA_API_SECRET:-}
      ALPACA_DATA_FEED: ${ALPACA_DATA_FEED:-iex}
      SUPPLY_CHAIN_AI_ENABLED: ${SUPPLY_CHAIN_AI_ENABLED:-false}
      CUSTOMER_MIX_AI_ENABLED: ${CUSTOMER_MIX_AI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_SUPPLY_CHAIN_MODEL: ${GEMINI_SUPPLY_CHAIN_MODEL:-gemini-3.1-flash-lite}
      GEMINI_CUSTOMER_MIX_PRIMARY_MODEL: ${GEMINI_CUSTOMER_MIX_PRIMARY_MODEL:-gemini-3.1-flash-lite}
      GEMINI_CUSTOMER_MIX_SECONDARY_MODEL: ${GEMINI_CUSTOMER_MIX_SECONDARY_MODEL:-gemini-2.5-flash-lite}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128,172.16.0.0/12}
      API_RATE_LIMIT_ENABLED: ${API_RATE_LIMIT_ENABLED:-true}
      API_GENERAL_RATE_PER_MINUTE: ${API_GENERAL_RATE_PER_MINUTE:-120}
      API_MARKET_RATE_PER_MINUTE: ${API_MARKET_RATE_PER_MINUTE:-30}
      API_VALUATION_RATE_PER_MINUTE: ${API_VALUATION_RATE_PER_MINUTE:-20}
      API_DCF_RATE_PER_MINUTE: ${API_DCF_RATE_PER_MINUTE:-6}
      API_AUTH_EMAIL_RATE_PER_MINUTE: ${API_AUTH_EMAIL_RATE_PER_MINUTE:-10}
      API_DCF_CONCURRENCY: ${API_DCF_CONCURRENCY:-2}
      API_PROVIDER_CONCURRENCY: ${API_PROVIDER_CONCURRENCY:-8}
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_INTERNAL_API_TOKEN: ${EMAIL_INTERNAL_API_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-VALUATOR}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-VALUATOR <onboarding@resend.dev>}
      RESEND_TEST_RECIPIENT: ${RESEND_TEST_RECIPIENT:-}
      RESEND_REPLY_TO: ${RESEND_REPLY_TO:-}
      RESEND_TIMEOUT_SECONDS: ${RESEND_TIMEOUT_SECONDS:-5}
      APP_BASE_URL: ${APP_BASE_URL:-http://127.0.0.1:3200}
    volumes:
      - valuator-backend-cache:/app/.cache
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-valuator-frontend:local}
    build:
      context: ./Front-End
      target: runner
      args:
        API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8000}
        NEXT_PUBLIC_LOGO_DEV_TOKEN: ${NEXT_PUBLIC_LOGO_DEV_TOKEN:-}
        SUPABASE_URL: ${SUPABASE_URL:-}
        SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
        APP_ENV: ${APP_ENV:-development}
    ports:
      - "${FRONTEND_PORT:-3200}:3000"
    environment:
      API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8000}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://127.0.0.1:3200}
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      EMAIL_INTERNAL_API_TOKEN: ${EMAIL_INTERNAL_API_TOKEN:-}
      APP_ENV: ${APP_ENV:-development}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  valuator-backend-cache:
