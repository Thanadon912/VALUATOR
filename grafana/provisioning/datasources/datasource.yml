apiVersion: 1

datasources:
  - name: K6-InfluxDB
    uid: k6-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    database: k6
    isDefault: true
  - name: Telegraf-InfluxDB
    uid: telegraf-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    database: telegraf
    isDefault: false
