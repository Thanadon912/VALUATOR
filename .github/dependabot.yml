version: 2
updates:
  - package-ecosystem: npm
    directory: /Front-End
    schedule:
      interval: monthly
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /Back-End
    schedule:
      interval: monthly
    groups:
      backend-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
