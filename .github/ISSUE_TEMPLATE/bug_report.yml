name: Bug report
description: Report a reproducible defect in VALUATOR
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, cookies, private account data, or full provider payloads. Report security issues privately.
  - type: input
    id: route
    attributes:
      label: Route and ticker
      description: Example `/stocks/MSFT/valuation`.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Open ...\n2. Select ...\n3. Observe ..."
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, device/viewport, and production or local.
    validations:
      required: true
  - type: input
    id: observed_at
    attributes:
      label: Observed at
      description: Date, time, and timezone; provider data can change.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence
      description: Add redacted screenshots, warning codes, or concise logs without secrets.
